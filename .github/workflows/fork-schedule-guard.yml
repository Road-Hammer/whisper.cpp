name: Fork Schedule Guard

on:
  push:
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-schedule-guard
  cancel-in-progress: true

jobs:
  build-cleanup-manifest:
    if: github.repository_owner == 'Road-Hammer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build cleanup manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          root=Path('.github/workflows'); guard=root/'fork-schedule-guard.yml'; files=[]
          def indent(s): return len(s)-len(s.lstrip(' '))
          for path in sorted([*root.glob('*.yml'),*root.glob('*.yaml')]):
              if path==guard: continue
              original=path.read_text(encoding='utf-8'); lines=original.splitlines(keepends=True); out=[]; i=0; altered=False
              while i<len(lines):
                  line=lines[i]
                  if re.match(r'^on:\s*(?:#.*)?(?:\r?\n)?$',line):
                      out.append(line); i+=1; block=[]
                      while i<len(lines):
                          x=lines[i]
                          if x.strip() and not x.startswith((' ','\t')) and not x.strip().startswith('#'): break
                          block.append(x); i+=1
                      clean=[]; j=0
                      while j<len(block):
                          x=block[j]
                          if re.match(r'^ {2}schedule:\s*(?:#.*)?(?:\r?\n)?$',x):
                              altered=True; j+=1
                              while j<len(block):
                                  y=block[j]
                                  if y.strip() and not y.lstrip().startswith('#') and indent(y)<=2: break
                                  j+=1
                              continue
                          clean.append(x); j+=1
                      if altered and not any(re.match(r'^ {2}[A-Za-z0-9_-]+:\s*',x) for x in clean if x.strip() and not x.lstrip().startswith('#')): clean.insert(0,'  workflow_dispatch:\n')
                      out.extend(clean); continue
                  out.append(line); i+=1
              updated=''.join(out)
              if altered and updated!=original: files.append({'path':str(path),'content':updated})
          manifest={'repository':'${{ github.repository }}','branch':'${{ github.ref_name }}','parent_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'base_tree_sha':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':files}
          d=Path('.fork-schedule-manifest'); d.mkdir(exist_ok=True); (d/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(f'Prepared {len(files)} workflow updates.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fork-schedule-manifest-${{ github.run_id }}
          path: .fork-schedule-manifest/manifest.json
          if-no-files-found: error
          retention-days: 1
